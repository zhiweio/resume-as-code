name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        working-directory: resume-builder-app
        run: pnpm install --frozen-lockfile
        env:
          # Unit tests and the production build do not launch Chromium;
          # the PDF export service downloads it on first local run instead.
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check:tsc

      - name: Test
        working-directory: resume-builder-app
        run: pnpm test

      - name: Build
        working-directory: resume-builder-app
        run: pnpm build
