  - id: projects
    type: projects
    items:
      - id: bayer-cdp
        name: "企业客户数据平台"
        description: "端到端 AWS 客户数据平台，具备受管控的 ingestion、数仓底座和安全数据 API。"
        startDate: 2022年12月
        summary:
          - "从 0 到 1 在 AWS 上构建，整合多数据源至受管控的湖仓一体；通过 Great Expectations + dbt 测试实现列级脱敏、行级安全及自动化质量门禁。"
          - "通过 FastAPI + API Gateway REST API 暴露受管控的数据，供 4 个下游客户端应用生产使用。"
        keywords:
          [
            AWS,
            Redshift,
            dbt,
            Glue,
            S3,
            FastAPI,
            Terraform,
            Great Expectations,
            Python,
          ]
      - id: migration
        name: "企业数据仓库迁移"
        description: "将 10 TB+ 数据仓库自动化迁移至云原生架构。"
        startDate: 2022年11月
        endDate: 2023年5月
        summary:
          - "设计了事件驱动的迁移工厂（Step Functions、Lambda、S3 事件和临时数据库），将全人工流程转变为一键可重复的管道，时间缩短 70%，零数据丢失。"
        keywords:
          [AWS, Step Functions, Lambda, RDS, Redshift, Python, Event-Driven]
      - id: streaming
        name: "实时分析平台"
        description: "高吞吐流式数据处理管道，每日处理 5 亿+ 事件，延迟亚秒级。"
        startDate: 2023年8月
        endDate: 2024年2月
        summary:
          - "使用 Kafka、Flink 和 Databricks Delta Lake 构建端到端流式架构，实时仪表盘实现 99.99% 可用性和 p99 延迟低于 100 毫秒。"
          - "实施自动伸缩策略，在保持性能 SLA 的前提下降低 35% 基础设施成本。"
        keywords:
          [
            Kafka,
            Apache Flink,
            Databricks,
            Delta Lake,
            Python,
            AWS,
            Prometheus,
            Grafana,
          ]
      - id: data-agent
        name: "企业数据智能体平台"
        description: "全栈智能体 BI 平台，具备受管控的语义层、NL2SQL 和交互式分析。"
        startDate: 2026年2月
        summary:
          - "领导端到端架构设计，实现双平面系统解耦语义治理与运行时执行，使业务用户能够通过自然语言查询数据，并具备自动验证和可解释性。"
        keywords:
          [
            Python,
            LLM APIs,
            FastAPI,
            TypeScript,
            React,
            PostgreSQL,
            Vector Search,
            AWS,
            NL2SQL,
          ]
      - id: governance
        name: "数据治理与合规框架"
        description: "面向企业数据资产的中心化元数据和治理系统。"
        startDate: 2024年3月
        endDate: 2024年9月
        summary:
          - "设计并实现了数据契约、自动化 PII 检测和审计日志，服务 50+ 数据生产者和 200+ 消费者。"
          - "通过实时监控将合规违规减少 92%，数据事件响应时间从 4 小时缩短至 15 分钟。"
        keywords:
          [
            Python,
            Apache Atlas,
            Data Contracts,
            dbt,
            PostgreSQL,
            Kubernetes,
            CI/CD,
          ]

