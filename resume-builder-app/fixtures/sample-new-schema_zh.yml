sections:
  - id: work
    type: work
    items:
      - id: accenture
        name: "泰克解决方案有限公司"
        position: 高级数据工程师
        startDate: 2022年11月
        summary:
          - "为生命科学和零售客户交付生产级数据平台项目，负责设计、实现、测试、CI/CD 以及 DEV、QA、PROD 环境的全流程支持。"
          - "在 AWS 上架构了企业客户数据平台，将多个数据源和遗留系统整合到受管控的湖仓一体及数仓底座中，为 4 个下游应用提供支持。"
          - "设计了事件驱动的迁移工厂（Step Functions + Lambda + S3 事件），自动化完成 10 TB+ 数据仓库迁移，端到端迁移时间缩短 70%。"
          - "领导设计并交付了双平面 NL2SQL 数据智能体平台，集成了 LLM API、受管控的语义层、向量搜索及 React/TypeScript 前端。"
        keywords:
          [
            AWS,
            Python,
            Redshift,
            dbt,
            Databricks,
            Terraform,
            Step Functions,
            Lambda,
            FastAPI,
            CI/CD,
            Docker,
          ]
      - id: patsnap
        name: "赛仕创新有限公司"
        position: 数据工程师
        startDate: 2021年6月
        endDate: 2022年11月
        summary:
          - "为企业 SaaS 产品设计并运维实时和批处理数据平台，服务数百万家企业及 1.8 亿条全球记录。"
          - "使用 Kafka 和 Flink 构建流式 ETL 管道；管理多系统及 AWS S3 上的湖仓一体模型。"
          - "作为核心团队成员，在双周敏捷迭代中推动交付，持续达成迭代目标。"
        keywords:
          [Python, Spark, Flink, Kafka, TiDB, AWS, Hive, CI/CD, Docker, Agile]
      - id: intsig
        name: "数据系统公司"
        position: 数据工程师
        startDate: 2019年6月
        endDate: 2021年6月
        summary:
          - "负责数据工程，围绕 2.3 亿+企业实体构建 ETL 管道和数据模型。"
          - "通过优化 Python 和 Hive 批处理管道，将数据新鲜度从 T+1 提升至近实时。"
          - "构建并维护搜索索引，支持 1 亿+文档全文搜索，用于企业风险信号检测。"
        keywords: [Python, Hive, Airflow, MySQL, Elasticsearch, Hadoop, ETL]

